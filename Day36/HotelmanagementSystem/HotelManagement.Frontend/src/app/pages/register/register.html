<div class="auth-wrap">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted">Book rooms and track your stays in one place.</p>
    <div class="spacer"></div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" [(ngModel)]="form.fullName" required maxlength="100" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="form.email" required email autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="form.password" required minlength="8" autocomplete="new-password" />
        <span class="hint">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="form.confirmPassword" required autocomplete="new-password" />
        @if (form.confirmPassword && !passwordsMatch) {
          <span class="hint" style="color: var(--danger)">Passwords do not match.</span>
        }
      </div>
      <button class="btn btn-block" type="submit" [disabled]="f.invalid || !passwordsMatch || loading()">
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch muted">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</div>

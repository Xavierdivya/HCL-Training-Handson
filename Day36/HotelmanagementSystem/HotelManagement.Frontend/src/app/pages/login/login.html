<div class="auth-wrap">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your bookings.</p>
    <div class="spacer"></div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required email autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-block" type="submit" [disabled]="f.invalid || loading()">
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="switch muted">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>

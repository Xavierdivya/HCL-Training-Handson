
<div class="container mt-4">

  <h2 class="mb-4">Add Food Item</h2>

  <!-- Success Message -->
  <div class="alert alert-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="saveFoodItem()" #foodForm="ngForm">

    <!-- Food Name -->
    <div class="mb-3">
      <label class="form-label">Food Name</label>
      <input
        type="text"
        class="form-control"
        name="foodName"
        [(ngModel)]="foodItemForm.foodName"
        required
        maxlength="100"
        placeholder="Enter food name">
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        name="description"
        [(ngModel)]="foodItemForm.description"
        maxlength="500"
        placeholder="Enter food description">
      </textarea>
    </div>

    <!-- Price -->
    <div class="mb-3">
      <label class="form-label">Price (₹)</label>
      <input
        type="number"
        class="form-control"
        name="price"
        [(ngModel)]="foodItemForm.price"
        min="0.01"
        step="0.01"
        required>
    </div>

    <!-- Image URL -->
    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input
        type="url"
        class="form-control"
        name="imageUrl"
        [(ngModel)]="foodItemForm.imageUrl"
        placeholder="Enter image URL">
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select
        class="form-select"
        name="categoryId"
        [(ngModel)]="foodItemForm.categoryId"
        required>

        <option [ngValue]="0" disabled>Select Category</option>

        <option
          *ngFor="let category of categories"
          [ngValue]="category.categoryId">
          {{ category.categoryName }}
        </option>

      </select>
    </div>

    <!-- Availability -->
    <div class="form-check mb-3">
      <input
        type="checkbox"
        class="form-check-input"
        id="isAvailable"
        name="isAvailable"
        [(ngModel)]="foodItemForm.isAvailable">

      <label class="form-check-label" for="isAvailable">
        Available
      </label>
    </div>

    <!-- Buttons -->
    <button
      type="submit"
      class="btn btn-primary me-2"
      [disabled]="isLoading">

      {{ isLoading ? 'Saving...' : 'Add Food Item' }}

    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="resetForm()">
      Reset
    </button>

  </form>

</div>

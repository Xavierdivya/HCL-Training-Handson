
<div class="auth-container">
  <div class="auth-card">

    <h2>Create Account</h2>
    <p>Join our Food Menu Management System</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Full Name</label>

        <input
          type="text"
          formControlName="fullName"
          placeholder="Enter your full name"
        />

        <small *ngIf="registerForm.controls.fullName.touched &&
                      registerForm.controls.fullName.invalid">
          Name must contain between 2 and 100 characters.
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <small *ngIf="registerForm.controls.email.touched &&
                      registerForm.controls.email.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          formControlName="password"
          placeholder="Create a password"
        />

        <small *ngIf="registerForm.controls.password.touched &&
                      registerForm.controls.password.invalid">
          Password must contain at least 8 characters.
        </small>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Register' }}
      </button>

    </form>

    <p>
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>

  </div>
</div>

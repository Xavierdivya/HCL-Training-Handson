<div class="app-wrapper">

  <nav class="main-navbar" *ngIf="showNavbar">
    <div class="navbar-inner">

      <a routerLink="/categories" class="brand">
        <span class="brand-icon">F</span>
        <span>Food<span class="brand-highlight">Hub</span></span>
      </a>

      <div class="nav-links">
        <a routerLink="/categories" routerLinkActive="active">
          Categories
        </a>

        <a routerLink="/food-items" routerLinkActive="active">
          Food Items
        </a>
      </div>

      <div class="user-section">
        <div class="user-details">
          <strong>{{ userName }}</strong>
          <span>{{ userRole }}</span>
        </div>

        <button class="logout-button" (click)="logout()">
          Logout
        </button>
      </div>

    </div>
  </nav>

  <main [class.auth-main]="!showNavbar">
    <router-outlet></router-outlet>
  </main>

</div>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Leave Management System</h1>
        <p>Apply for leave and track your requests</p>
    </header>

    <main>
        <section class="card">
            <h2>Apply for Leave</h2>

            <form id="leaveForm">
                <label for="employeeName">Employee Name</label>
                <input type="text" id="employeeName"
                       maxlength="100" placeholder="Enter employee name" required>

                <label for="leaveType">Leave Type</label>
                <select id="leaveType" required>
                    <option value="">Select Leave Type</option>
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Sick Leave">Sick Leave</option>
                    <option value="Earned Leave">Earned Leave</option>
                    <option value="Personal Leave">Personal Leave</option>
                </select>

                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required>

                <label for="endDate">End Date</label>
                <input type="date" id="endDate" required>

                <label for="reason">Reason</label>
                <textarea id="reason" maxlength="500"
                          placeholder="Enter leave reason" required></textarea>

                <button type="submit">Submit Leave Request</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>Leave Requests</h2>
                <button type="button" id="refreshBtn">Refresh</button>
            </div>

            <label for="statusFilter">Filter by Status</label>
            <select id="statusFilter">
                <option value="All">All</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaveTableBody">
                        <tr><td colspan="8">Loading requests...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

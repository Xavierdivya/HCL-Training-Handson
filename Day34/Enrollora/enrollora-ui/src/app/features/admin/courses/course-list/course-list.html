
<!-- SUMMARY -->
<div class="summary-grid">
  <div class="summary-card">
    <div class="summary-icon">▤</div>
    <div class="summary-info">
      <span>Matching Courses</span>
      <strong>{{ totalRecords() }}</strong>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-icon">✓</div>
    <div class="summary-info">
      <span>Active on This Page</span>
      <strong>{{ activeCoursesOnPage() }}</strong>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-icon">○</div>
    <div class="summary-info">
      <span>Inactive on This Page</span>
      <strong>{{ inactiveCoursesOnPage() }}</strong>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-icon">◷</div>
    <div class="summary-info">
      <span>Available Seats on This Page</span>
      <strong>{{ availableSeatsOnPage() }}</strong>
    </div>
  </div>
</div>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="Student-Management-System.css">
</head>
<body>

    <h1>PSNA College of Engineering &amp; Technology</h1>
    <h2>Student Management System</h2>

    <form class="admission" id="studentForm">

        <label for="name">Name</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="cutoff">HSC Cutoff</label>
        <input type="number" id="cutoff" min="0" max="200"
               step="any" required>
        <br><br>

        <label for="dept">Department</label>
        <select id="dept" required>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="AIDS">AIDS</option>
        </select>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="ph">Phone Number</label>
        <input type="tel" id="ph" required>
        <br><br>

        <label for="address">Address</label>
        <br>
        <textarea rows="4" cols="40" id="address" required></textarea>
        <br><br>

        <button type="button" onclick="addStudent()">ADD</button>
        <button type="button" onclick="removeStudent()">REMOVE</button>
        <button type="button" onclick="showStudentList()">SHOW LIST</button>

    </form>

    <p id="addedmsg" role="status" aria-live="polite"></p>

    <h2>Student List</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>NAME</th>
                    <th>CUT-OFF</th>
                    <th>DEPARTMENT</th>
                    <th>E-MAIL</th>
                    <th>PHONE</th>
                    <th>ADDRESS</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
                <!-- Student records will be added here -->
            </tbody>
        </table>
    </div>

    <script src="Student-Management-System.js"></script>

</body>
</html>

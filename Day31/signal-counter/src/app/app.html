
<div class="container">
  <h1>Angular Signal Counter</h1>

  <h2>Count: {{ count() }}</h2>

  <p>Square: {{ square() }}</p>

  <p>Status: {{ status() }}</p>

  <div class="buttons">
    <button (click)="increment()">Increment +</button>

    <button (click)="decrement()">Decrement -</button>

    <button (click)="reset()">Reset</button>
  </div>
</div>
